# Nginx site example for the current Linux deployment.
# Production: public :1314 -> backend :8848
# Test:       public :9958 -> backend :9527
#
# Install:
#   sudo cp bbctg_vita_web/scripts/deploy/nginx-antibody-forge-sites-active.conf /etc/nginx/sites-available/antibody-forge.conf
#   sudo ln -sf /etc/nginx/sites-available/antibody-forge.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 1314;
    server_name _;

    client_max_body_size 200m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        root /home/tianba/prod/Antibody_Forge/bbctg_vita_web/apps/antibody_vita/dist;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8848/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /serum-api/ {
        proxy_pass http://127.0.0.1:8848/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }
}

