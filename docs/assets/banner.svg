<svg xmlns="http://www.w3.org/2000/svg" width="960" height="200" viewBox="0 0 960 200" role="img" aria-labelledby="title">
  <title id="title">Antibody Forge</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="55%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#99f6e4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5eead4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#99f6e4" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="960" height="200" rx="16" fill="url(#bg)"/>

  <circle cx="120" cy="160" r="90" fill="#2dd4bf" opacity="0.18" filter="url(#soft)">
    <animate attributeName="cx" values="110;150;110" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.14;0.24;0.14" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="40" r="110" fill="#99f6e4" opacity="0.12" filter="url(#soft)">
    <animate attributeName="cy" values="30;70;30" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="180" r="70" fill="#14b8a6" opacity="0.16" filter="url(#soft)">
    <animate attributeName="r" values="60;80;60" dur="9s" repeatCount="indefinite"/>
  </circle>

  <path d="M0 130 C180 90 320 170 480 120 S820 70 960 110 L960 200 L0 200 Z" fill="#042f2e" opacity="0.35">
    <animate attributeName="d"
      values="M0 130 C180 90 320 170 480 120 S820 70 960 110 L960 200 L0 200 Z;
              M0 140 C200 110 340 150 500 105 S800 95 960 125 L960 200 L0 200 Z;
              M0 130 C180 90 320 170 480 120 S820 70 960 110 L960 200 L0 200 Z"
      dur="14s" repeatCount="indefinite"/>
  </path>

  <rect x="0" y="0" width="960" height="200" rx="16" fill="url(#sheen)">
    <animate attributeName="opacity" values="0.55;0.2;0.55" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="480" y="92" text-anchor="middle"
        font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="42" font-weight="600" fill="#ecfdf5">Antibody Forge</text>
  <text x="480" y="132" text-anchor="middle"
        font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="16" fill="#99f6e4">Immunity · Titer · Automation · Discovery</text>
</svg>
