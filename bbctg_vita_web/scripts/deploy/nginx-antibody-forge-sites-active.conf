# Antibody Forge Nginx 站点样例（Linux test / prod）
# 生产：对外 :1314 → 后端 :8848
# 测试：对外 :9958 → 后端 :9527
#
# 用法：复制到 /etc/nginx/sites-available/，把下面两处 root 改成本机
# .../bbctg_vita_web/apps/antibody_vita/dist 的绝对路径；本机只跑一个环境时
# 可删掉不用的 server；然后按 docs/deploy.md 启用并 reload。

server {
    listen 1314;
    server_name _;

    client_max_body_size 200m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        # 改成本机绝对路径：…/bbctg_vita_web/apps/antibody_vita/dist
        root /home/tianba/prod/Antibody_Forge/bbctg_vita_web/apps/antibody_vita/dist;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8848/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

}

server {
    listen 9958;
    server_name _;

    client_max_body_size 200m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        # 改成本机绝对路径：…/bbctg_vita_web/apps/antibody_vita/dist
        root /home/tianba/prod/Antibody_Forge/bbctg_vita_web/apps/antibody_vita/dist;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9527/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

}
