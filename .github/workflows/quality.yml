name: Quality

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bbctg_vita_server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bbctg_vita_server/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m compileall -q .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bbctg_vita_web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: bbctg_vita_web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bbctg/antibody-vita typecheck
      - run: pnpm --filter @bbctg/antibody-vita build
